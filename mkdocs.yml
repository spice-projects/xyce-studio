site_name: Xyce Studio
site_description: GUI for the Xyce circuit simulator with waveform visualization and KiCad integration
site_url: https://spice-projects.github.io/xyce-studio/
repo_url: https://github.com/spice-projects/xyce-studio
repo_name: spice-projects/xyce-studio
copyright: Copyright &copy; 2026 spice-projects &mdash; Apache-2.0

theme:
  name: material
  icon:
    logo: fontawesome/brands/github-alt
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      accent: teal
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - content.code.copy
    - navigation.expand
    - navigation.footer
    - navigation.sections
    - navigation.tabs
    - navigation.top
    - search.highlight
    - toc.follow

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/spice-projects/xyce-studio

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - toc:
      permalink: true
  - tables

plugins:
  - search

nav:
  - Home: index.md
  - Getting Started:
      - Installation: getting-started/installation.md
      - First Simulation: getting-started/first-simulation.md
  - User Guide:
      - Overview: user-guide/index.md
      - The Main Window: user-guide/main-window.md
      - Configuring Xyce: user-guide/configuration.md
      - Running Simulations: user-guide/simulations.md
      - Simulation Output Files: user-guide/output-files.md
      - Viewing Results: user-guide/charts.md
      - Troubleshooting: user-guide/troubleshooting.md
      - FAQ: faq.md
  - Development:
      - Building from Source: development/building.md
