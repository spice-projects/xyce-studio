name: C++ CI Workflow

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - '**'
    tags:
      - 'v*'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/') }}

permissions:
  pull-requests: write
  contents: read

jobs:
  check-pr:
    if: github.event_name == 'push' && github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/')
    timeout-minutes: 5
    runs-on: ubuntu-latest
    outputs:
      has_pr: ${{ steps.check.outputs.has_pr }}
    steps:
      - name: Check for open PR
        id: check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          response=$(curl -skf -H "Authorization: token $GITHUB_TOKEN" "${GITHUB_API_URL}/repos/${{ github.repository }}/pulls?head=${{ github.repository_owner }}:${{ github.ref_name }}&state=open&per_page=1" 2>&1)
          echo "API response: ${response}"
          count=$(echo "$response" | grep -c '"number"' || true)
          echo "has_pr=$( [ "$count" -gt 0 ] && echo true || echo false )" >> $GITHUB_OUTPUT

  build-and-test:
    name: Build & Test (${{ matrix.os }})
    needs: [check-pr]
    if: |-
      !cancelled() &&
      (github.event_name != 'push' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || needs.check-pr.outputs.has_pr != 'true')
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: macos-26
            platform: macos-arm64
            build_enabled: true
          - os: macos-26-intel
            platform: macos-x64
            build_enabled: true
          - os: windows-latest
            platform: windows-x64
            build_enabled: true
          - os: ubuntu-latest
            platform: ubuntu-x64
            build_enabled: true
    runs-on: ${{ matrix.os }}
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      VCPKG_BINARY_SOURCES: 'clear;files,${{ github.workspace }}/.vcpkg-cache,readwrite'
    steps:
      - name: Checkout repository
        if: ${{ matrix.build_enabled }}
        uses: actions/checkout@v7

      - name: Run clang-format check
        if: ${{ matrix.build_enabled && matrix.os == 'macos-26' }}
        shell: bash
        env:
          HOMEBREW_NO_REQUIRE_TAP_TRUST: 1
        run: |
          if ! command -v clang-format >/dev/null 2>&1; then
            brew install clang-format
          fi
          bash build/check-format.sh

      - name: Setup Ninja
        if: ${{ matrix.build_enabled }}
        shell: bash
        run: pip install ninja

      - name: Install Linux build dependencies
        if: ${{ matrix.build_enabled && runner.os == 'Linux' }}
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq pkg-config libexpat1-dev libfontconfig1-dev libfreetype-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libx11-dev libxcb1-dev \
            libgl1-mesa-dev libegl1-mesa-dev libwayland-dev xvfb

      - name: Restore vcpkg binary cache
        if: ${{ matrix.build_enabled }}
        uses: actions/cache@v5
        with:
          path: ${{ github.workspace }}/.vcpkg-cache
          key: vcpkg-${{ matrix.os }}-build-${{ hashFiles('vcpkg.json') }}-${{ hashFiles('vcpkg-configuration.json') }}
          restore-keys: |
            vcpkg-${{ matrix.os }}-build-

      - name: Setup vcpkg
        if: ${{ matrix.build_enabled }}
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgJsonGlob: 'vcpkg.json'

      - name: Restore CMake build cache
        if: ${{ matrix.build_enabled }}
        uses: actions/cache@v5
        with:
          path: |
            ${{ github.workspace }}/.build-release
            ${{ github.workspace }}/.ccache
          key: cmake-${{ matrix.os }}-build-${{ hashFiles('vcpkg-configuration.json') }}-${{ hashFiles('vcpkg.json') }}-${{ hashFiles('tests/CMakeLists.txt') }}-${{ hashFiles('CMakeLists.txt') }}-${{ hashFiles('CMakePresets.json') }}
          restore-keys: |
            cmake-${{ matrix.os }}-build-

      - name: Setup ccache
        if: ${{ matrix.build_enabled }}
        shell: bash
        run: |
          if ! command -v ccache >/dev/null 2>&1; then
            if [ "$RUNNER_OS" = "macOS" ]; then
              brew install ccache
            elif [ "$RUNNER_OS" = "Linux" ]; then
              sudo apt-get install -y -qq ccache
            elif [ "$RUNNER_OS" = "Windows" ]; then
              choco install ccache
            fi
          fi

      - name: Setup MSVC dev environment
        if: ${{ matrix.build_enabled && runner.os == 'Windows' }}
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure CMake
        if: ${{ matrix.build_enabled && hashFiles('.build-release/CMakeCache.txt') == '' }}
        shell: bash
        run: cmake --preset release

      - name: Build C++ Target
        if: ${{ matrix.build_enabled }}
        run: cmake --build --preset release

      - name: Run C++ Tests
        if: ${{ matrix.build_enabled }}
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            ./.build-release/tests/xyce-studio-tests.exe --gtest_filter=-Ui*
          elif [ "$RUNNER_OS" = "Linux" ]; then
            # the runners are headless; slint's winit backend needs an X display
            xvfb-run -a ./.build-release/tests/xyce-studio-tests
          else
            ./.build-release/tests/xyce-studio-tests
          fi

      - name: Gather runtime dependencies
        if: ${{ matrix.build_enabled }}
        run: cmake --install .build-release --component RuntimeDeps --prefix .build-release

      - name: Upload build artifact
        if: ${{ matrix.build_enabled }}
        uses: actions/upload-artifact@v7
        with:
          name: xyce-studio-${{ matrix.platform }}
          path: .build-release/artifacts/
          if-no-files-found: error
          retention-days: 7

  coverage:
    name: C++ Coverage
    needs: [check-pr]
    if: |-
      !cancelled() &&
      github.repository == 'spice-projects/xyce-studio' &&
      (github.event_name != 'push' || needs.check-pr.outputs.has_pr == 'true') &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    permissions:
      contents: read
      pull-requests: read
      code-quality: write
    uses: ./.github/workflows/coverage.yml

  macos-app-bundle:
    name: macOS App Bundle
    needs: [build-and-test]
    if: |-
      !cancelled() &&
      (github.event_name != 'push' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || needs.check-pr.outputs.has_pr != 'true')
    runs-on: macos-26
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download arm64 artifact
        uses: actions/download-artifact@v8
        with:
          name: xyce-studio-macos-arm64
          path: artifacts/arm64

      - name: Download x64 artifact
        uses: actions/download-artifact@v8
        with:
          name: xyce-studio-macos-x64
          path: artifacts/x64

      - name: Create macOS app bundle
        run: |
          APP_BUNDLE="artifacts/Xyce Studio.app"
          rm -rf "$APP_BUNDLE"
          mkdir -p "$APP_BUNDLE/Contents/MacOS" "$APP_BUNDLE/Contents/Resources"

          cp "plugin-icon-64x64.png" "$APP_BUNDLE/Contents/Resources/plugin-icon-64x64.png"

          lipo -create \
            -output "$APP_BUNDLE/Contents/MacOS/xyce-studio" \
            "artifacts/arm64/xyce-studio" \
            "artifacts/x64/xyce-studio"

          dylib_names=$( { ls artifacts/arm64/*.dylib artifacts/x64/*.dylib; } 2>/dev/null | xargs -n1 basename | sort -u)
          for name in $dylib_names; do
            arm64_lib="artifacts/arm64/$name"
            x64_lib="artifacts/x64/$name"
            dest="$APP_BUNDLE/Contents/MacOS/$name"
            if [ -f "$arm64_lib" ] && [ -f "$x64_lib" ]; then
              lipo -create -output "$dest" "$arm64_lib" "$x64_lib"
            elif [ -f "$arm64_lib" ]; then
              cp "$arm64_lib" "$dest"
            else
              cp "$x64_lib" "$dest"
            fi
          done

          cat > "$APP_BUNDLE/Contents/Info.plist" <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>xyce-studio</string>
              <key>CFBundleIdentifier</key>
              <string>com.spice-projects.xyce-studio</string>
              <key>CFBundleIconFile</key>
              <string>plugin-icon-64x64.png</string>
              <key>CFBundleName</key>
              <string>Xyce Studio</string>
              <key>CFBundleDisplayName</key>
              <string>Xyce Studio</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0</string>
              <key>CFBundleVersion</key>
              <string>1</string>
          </dict>
          </plist>
          EOF

          chmod +x "$APP_BUNDLE/Contents/MacOS/xyce-studio"
          install_name_tool -add_rpath @executable_path "$APP_BUNDLE/Contents/MacOS/xyce-studio" 2>/dev/null || true
          codesign --force --sign - "$APP_BUNDLE/Contents/MacOS/xyce-studio" 2>/dev/null || true

      - name: Stage macOS app bundle for upload
        run: |
          mkdir -p _upload
          cp -R "artifacts/Xyce Studio.app" _upload/

      - name: Upload macOS app bundle artifact
        uses: actions/upload-artifact@v7
        with:
          name: Xyce Studio.app
          path: _upload/
          if-no-files-found: error
          retention-days: 7

  package:
    name: Package & Artifacts
    needs: [build-and-test, macos-app-bundle]
    if: ${{ always() && !cancelled() && !failure() && github.ref_type == 'tag' && needs.build-and-test.result == 'success' && needs.macos-app-bundle.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Extract version from tag
        id: version
        run: echo "version=$(echo '${{ github.ref_name }}' | sed 's/^v//')" >> $GITHUB_OUTPUT

      - name: Download macOS app bundle artifact
        uses: actions/download-artifact@v8
        with:
          name: Xyce Studio.app
          path: artifacts/macos

      - name: Download Windows artifact
        uses: actions/download-artifact@v8
        with:
          name: xyce-studio-windows-x64
          path: artifacts/windows

      - name: Package macOS
        run: |
          mkdir -p packages
          # upload-artifact does not preserve file permissions, restore the exec bit
          chmod +x "artifacts/macos/Xyce Studio.app/Contents/MacOS/xyce-studio"
          bash build/create-kicad-package.sh '${{ steps.version.outputs.version }}.1' "artifacts/macos/Xyce Studio.app" "Xyce Studio.app/Contents/MacOS/xyce-studio" macos
          cp dist/xyce-studio-${{ steps.version.outputs.version }}.1.zip packages/kicad-xyce-plugin-macos.zip
          # zip from inside artifacts/macos so the archive has no path prefix
          (cd artifacts/macos && zip -qry "../../packages/xyce-studio-macos.zip" "Xyce Studio.app")

      - name: Package Windows
        run: |
          dlls=$(ls artifacts/windows/*.dll 2>/dev/null | tr '\n' ' ')
          bash build/create-kicad-package.sh '${{ steps.version.outputs.version }}.2' artifacts/windows/xyce-studio.exe xyce-studio.exe windows "$dlls"
          mkdir -p packages
          cp dist/xyce-studio-${{ steps.version.outputs.version }}.2.zip packages/kicad-xyce-plugin-windows.zip

      - name: Associate with GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.ref_name }}" \
            packages/kicad-xyce-plugin-macos.zip \
            packages/kicad-xyce-plugin-windows.zip \
            "packages/xyce-studio-macos.zip" \
            --clobber
