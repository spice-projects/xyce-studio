name: C++ Coverage (reusable)

on:
  workflow_call:
    inputs:
      checkout_ref:
        description: Git ref to check out (empty = default for the triggering event)
        type: string
        required: false
        default: ''
      upload_enabled:
        description: Whether to publish the Cobertura report to the code coverage API
        type: boolean
        required: false
        default: true

jobs:
  coverage:
    name: C++ Coverage
    runs-on: macos-26
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      VCPKG_BINARY_SOURCES: 'clear;files,${{ github.workspace }}/.vcpkg-cache,readwrite'
    steps:
      - name: Checkout repository
        # persist-credentials: false keeps the job token out of .git/config; required for the fork-PR path where untrusted code is built and tested
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.checkout_ref }}
          persist-credentials: false

      - name: Setup Ninja
        shell: bash
        run: pip install ninja

      - name: Restore vcpkg binary cache
        uses: actions/cache@v5
        with:
          path: ${{ github.workspace }}/.vcpkg-cache
          key: vcpkg-macos-26-profile-${{ hashFiles('vcpkg.json') }}-${{ hashFiles('vcpkg-configuration.json') }}-${{ hashFiles('.triplets/**', '.ports/**') }}
          restore-keys: |
            vcpkg-macos-26-profile-

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgJsonGlob: 'vcpkg.json'

      - name: Restore cmake build cache
        uses: actions/cache@v5
        with:
          path: |
            ${{ github.workspace }}/.build-profile
            ${{ github.workspace }}/.ccache
          key: cmake-macos-26-profile-${{ hashFiles('vcpkg-configuration.json') }}-${{ hashFiles('vcpkg.json') }}-${{ hashFiles('tests/CMakeLists.txt') }}-${{ hashFiles('CMakeLists.txt') }}-${{ hashFiles('CMakePresets.json') }}
          restore-keys: |
            cmake-macos-26-profile-${{ hashFiles('vcpkg-configuration.json') }}-${{ hashFiles('vcpkg.json') }}-${{ hashFiles('tests/CMakeLists.txt') }}-${{ hashFiles('CMakeLists.txt') }}-${{ hashFiles('CMakePresets.json') }}

      - name: Setup ccache
        shell: bash
        run: |
          if ! command -v ccache >/dev/null 2>&1; then
            brew install ccache
          fi

      - name: Configure CMake
        if: ${{ hashFiles('.build-profile/CMakeCache.txt') == '' }}
        shell: bash
        run: cmake --preset profile

      - name: Build C++ Target
        run: cmake --build --preset profile --target xyce-studio-tests

      - name: Run C++ Tests
        shell: bash
        env:
          LLVM_PROFILE_FILE: ${{ github.workspace }}/coverage.profraw
        run: |
          ./.build-profile/tests/xyce-studio-tests --gtest_filter=-Ui*

      - name: Generate Cobertura report
        shell: bash
        run: |
          xcrun llvm-profdata merge --sparse coverage.profraw --output coverage.profdata
          xcrun llvm-cov export \
            --instr-profile coverage.profdata \
            --format=lcov \
            ./.build-profile/tests/xyce-studio-tests "$PWD/src" \
            ./.build-profile/tests/xyce-studio-tests > coverage.lcov
          pip install lcov_cobertura
          lcov_cobertura coverage.lcov --output cobertura.xml

      - name: Upload coverage report artifact
        if: ${{ inputs.upload_enabled }}
        uses: actions/upload-artifact@v7
        with:
          name: cobertura-report
          path: cobertura.xml
          if-no-files-found: error
          retention-days: 7

  upload-coverage:
    name: Upload Coverage
    needs: [coverage]
    if: ${{ !cancelled() && !failure() && needs.coverage.result == 'success' && inputs.upload_enabled }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      code-quality: write
    steps:
      - name: Download coverage report
        uses: actions/download-artifact@v8
        with:
          name: cobertura-report

      - name: Upload to GitHub code coverage API
        uses: actions/upload-code-coverage@v1
        with:
          file: cobertura.xml
          language: C++
          label: code-coverage/c++
